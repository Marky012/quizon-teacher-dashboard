# Netlify build settings for the QuizOn! Teacher Dashboard.
#
# The SPA redirect is what makes /classes/<id> and /students/<id> survive a
# hard refresh. There is no service worker here, so there is nothing else to
# configure.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed build assets are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
